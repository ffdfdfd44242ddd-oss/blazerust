name: BLAZE RUST Wiki — GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка из blaze.py
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка Flask
        run: pip install flask

      - name: Генерация сайта из Python (blaze.py)
        run: python blaze.py --build --base "/${{ github.event.repository.name }}"

      # Фикс: запрещает Jekyll обрабатывать сайт,
      # чтобы GitHub отдавал HTML как сайт, а не как текст
      - name: Добавить .nojekyll
        run: touch _site/.nojekyll

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Загрузка артефакта
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Публикация на GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
